# Build the userscript and push the generated artifact back to the repository.
name: User script generation

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Normalize EOL
        run: sed -i 's/\r//g' scripts/MyNovelReader.user.js

      - name: Commit and push generated script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet scripts/MyNovelReader.user.js; then
            echo "No changes in generated script; skipping commit."
            exit 0
          fi
          git add scripts/MyNovelReader.user.js
          git commit -m "auto: user script generated"
          git push
