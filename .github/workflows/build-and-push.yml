# Build the userscript and push the generated artifact back to the repository.
name: User script generation

on: [push]

concurrency:
  group: userscript-generation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:strict

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run check:size

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Local userscript smoke
        run: npm run e2e:local:run

      - name: Upload generated userscript
        uses: actions/upload-artifact@v6
        with:
          name: generated-userscript
          path: scripts/MyNovelReader.user.js
          if-no-files-found: error

  sync-artifact:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download generated userscript
        uses: actions/download-artifact@v7
        with:
          name: generated-userscript
          path: scripts

      - name: Normalize EOL
        run: sed -i 's/\r//g' scripts/MyNovelReader.user.js

      - name: Commit and push generated script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet scripts/MyNovelReader.user.js; then
            echo "No changes in generated script; skipping commit."
            exit 0
          fi
          git add scripts/MyNovelReader.user.js
          git commit -m "auto: user script generated"
          git push
